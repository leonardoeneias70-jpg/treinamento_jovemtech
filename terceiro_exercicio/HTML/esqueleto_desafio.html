<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desafio POO + DOM - Squad [Número]</title>
</head>
<body>

  <h1>📱 Delivery </h1>
  <hr>

  <!-- 1. PAINEL DE EXIBIÇÃO (DOM + GET) -->
  <h2>Painel de Informações</h2>
  <p>Número do Pedido: <strong id="numero-pedido">#101</strong></p>
  <p>Status do Pedido: <strong id="status-pedido">Pendente</strong></p>

  <hr>

  <!-- 2. CONTROLES E FORMULÁRIOS (DOM + SET) -->
  <h3>Ações do Aplicativo</h3>
  <button onclick="executarAcaoPrincipal()">Executar Ação</button>

  <br><br>

  <label for="campo-input">Digitar Novo Valor:</label>
  <input type="text" id="campo-input">
  <button onclick="executarSet()">Atualizar via SET</button>

   <br> <label for="select-status">Novo Status:</label> <br>
  <select id="select-status">
    <option value="Pendente">Pendente</option>
    <option value="Em Preparo">Em Preparo</option>
    <option value="Entregue">Entregue</option>
  </select>
  <button onclick="atualizarStatus()">Atualizar Status</button>

    <button class="cancelar" onclick="cancelarPedido()">
        Cancelar Pedido
    </button>
<br><br>
  <button onclick="testarStatusInvalido()">Validar Pedido</button>
  <hr>

  <!-- 3. CONSOLE VISUAL -->
  <h3>Console de Operações:</h3>
  <div id="console-output"></div>

  <script>
    class Pedido { /* PASSO A: Cole aqui a Classe em JS criada nas aulas anteriores*/ 
        #status;
        #cancelado;
        constructor(numeroPedido, statusInicial = "Pendente") {
            this._numeroPedido = numeroPedido;
            this.#status = statusInicial;
            this.#cancelado = false;
            this.status = statusInicial;
        }

        get numeroPedido() {
            return this._numeroPedido;
        }

        get status() {
            return this.#status;
        }

        set status(novoStatus) {
            const statusValidos = ["Pendente", "Em Preparo", "Entregue"];

            if (!statusPermitidos.includes(novoStatus)) {

                exibirNoConsole(
                    `❌ ERRO: Status "${novoStatus}" não permitido!`
                );

                exibirNoConsole(
                    `⚠️ Status mantido: ${this.#status}`
                );

                return;
            }

            if (this.#cancelado) {
                exibirNoConsole(
                    "❌ Não é possível alterar um pedido cancelado!"
                );
                return;
            }

            this.#status = novoStatus;

            exibirNoConsole(
                `✅ Status atualizado para: ${this.#status}`
            );
        }

        cancelar() {
            if (this.#cancelado) {
                exibirNoConsole(
                    "❌ Pedido já está cancelado!"
                );
            } else if (this.#status === "Pendente") {

            this.#cancelado = true;

            exibirNoConsole(
                `✅ Pedido #${this._numeroPedido} foi cancelado com sucesso!`
            );
          }
        }

        get cancelado() {
            return this.#cancelado;
        }
        
    }
      const pedido01 = new Pedido("Pizza Margherita", "R$25.90", "Pendente"); /* PASSO B: Instancie o objeto do seu Squad */
          
      function exibirNoConsole(mensagem) {
        const consoleOutput = document.getElementById("console-output");

        const linha = document.createElement("p");
        linha.textContent = `> ${mensagem}`;
        consoleOutput.appendChild(linha);
      }
      
      
      
      
      
      
      function atualizarTela() {

        document.getElementById("numero-pedido").textContent =
            "#" + pedido01.numeroPedido;

        const campoStatus =
            document.getElementById("status-pedido");

        if (pedido01.cancelado) {

            campoStatus.textContent = "CANCELADO";
            campoStatus.style.color = "red";

        } else {

            campoStatus.textContent = pedido01.status;
            campoStatus.style.color = "#087b35";

        }

    }    

    function atualizarStatus() {

    const novoStatus = document.getElementById("select-status").value;
    exibirNoConsole(
            `[AÇÃO] Atualizando status para: ${novoStatus}`
        );

    pedido01.status = novoStatus;

    atualizarTela();
}

    function cancelarPedido() {
      exbirNoConsole(
            `[AÇÃO] Cancelando pedido...`
        );
        pedido01.cancelar();
        atualizarTela();
    }

    function testarStatusInvalido() {

        exibirNoConsole(
            "[TESTE] Tentando enviar status: Finalizado"
        );

        pedido01.status = "Finalizado";

        atualizarTela();

    }

      exibirNoConsole(
            "Sistema de Delivery carregado com sucesso!"
        );

      exibirNoConsole(
        `Pedido #${pedido01.numeroPedido} criado com status: ${pedido01.status}`
    );

        atualizarTela();
  </script>
</body>
</html>
